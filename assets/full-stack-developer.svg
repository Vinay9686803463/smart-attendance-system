<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Full stack web development illustration</title>
  <desc id="desc">A laptop with code, web servers, a database, and connecting arrows.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#39c6ff"/>
      <stop offset="1" stop-color="#0759d7"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#173c83"/>
      <stop offset="1" stop-color="#06183e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1">
      <stop stop-color="#6e35f3"/>
      <stop offset="1" stop-color="#b14cff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#dff8ff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#68cfff" stop-opacity=".33"/>
      <stop offset="1" stop-color="#4e35e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020c2b" flood-opacity=".45"/>
    </filter>
  </defs>

  <ellipse cx="450" cy="355" rx="420" ry="255" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <path d="M260 150c115-98 291-98 408 2" fill="none" stroke="url(#blue)" stroke-linecap="round" stroke-width="28"/>
    <path d="m675 103 73 58-93 10z" fill="url(#blue)"/>

    <rect x="90" y="205" width="330" height="247" rx="25" fill="url(#navy)" stroke="#128df5" stroke-width="9"/>
    <path d="M99 261h312v-31c0-9-7-16-16-16H115c-9 0-16 7-16 16z" fill="#0a2860"/>
    <circle cx="130" cy="236" r="11" fill="#ff645f"/>
    <circle cx="163" cy="236" r="11" fill="#ffd24c"/>
    <circle cx="196" cy="236" r="11" fill="#20d7a9"/>
    <rect x="116" y="281" width="278" height="144" rx="14" fill="#eff8ff"/>
    <path d="m210 330-42 30 42 30M300 318l-35 84M324 330l42 30-42 30" fill="none" stroke="#0b3477" stroke-linecap="round" stroke-linejoin="round" stroke-width="18"/>
    <path d="M59 452h391l-31 35H92z" fill="url(#blue)"/>
    <rect x="210" y="461" width="92" height="11" rx="6" fill="#123d86"/>

    <g>
      <rect x="555" y="206" width="244" height="82" rx="22" fill="url(#navy)"/>
      <rect x="555" y="300" width="244" height="82" rx="22" fill="url(#navy)"/>
      <rect x="555" y="394" width="244" height="82" rx="22" fill="url(#navy)"/>
      <path d="M586 244h112M586 338h112M586 432h112" stroke="#5e91ef" stroke-linecap="round" stroke-width="12"/>
      <circle cx="758" cy="244" r="15" fill="#24baff"/>
      <circle cx="758" cy="338" r="15" fill="#20d7a9"/>
      <circle cx="758" cy="432" r="15" fill="#8f4dff"/>
    </g>

    <g transform="translate(385 410)">
      <path d="m68 0 118 62-118 62L-50 62z" fill="url(#blue)" stroke="#d0f5ff" stroke-width="5"/>
      <path d="m68 88 118 62-118 62L-50 150z" fill="url(#purple)" stroke="#d6bdff" stroke-width="5"/>
      <path d="m68 176 118 62-118 62L-50 238z" fill="#173a89" stroke="#9dbfff" stroke-width="5"/>
    </g>
  </g>
</svg>
